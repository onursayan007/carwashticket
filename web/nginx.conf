server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API aynı origin altında: tarayıcı açısından CORS yok, çerez sorunsuz,
    # sertifika derdi yok. Bu yüzden SPA ve API tek kapıdan geçiyor.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger'ı da açıyoruz; demoda API'yi gezmek isteyen olur.
    location /swagger/ {
        proxy_pass http://api:8080/swagger/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vue Router history modu: bilinmeyen yollar index.html'e düşer.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hash'li varlıklar uzun süre önbelleklenebilir.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
