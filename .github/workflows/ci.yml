name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend testleri
    runs-on: ubuntu-latest

    # Testler gerçek PostgreSQL istiyor: InMemory ile unique index ve
    # ExecuteUpdate davranışları doğrulanamıyor.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: carwash
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Testleri çalıştır
        env:
          TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=carwash;Database=postgres
        run: dotnet test api.tests/CarWashTicket.Api.Tests.csproj --verbosity normal

  frontend:
    name: Frontend derleme ve tip kontrolü
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      # vue-tsc + vite build: tip hatası varsa burada patlar.
      - run: npm run build
        working-directory: web
