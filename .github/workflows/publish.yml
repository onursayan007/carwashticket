name: İmajları yayınla

# main'e her push'ta iki imajı derleyip GitHub Container Registry'ye gönderir.
# Azure Container Apps bu imajları çeker.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Registry'ye giriş
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Otomatik token; ayrıca kişisel token oluşturmaya gerek yok.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API imajı
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/carwash-api:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/carwash-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Web imajı
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=
            VITE_MAPTILER_KEY=${{ secrets.MAPTILER_KEY }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/carwash-web:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/carwash-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
